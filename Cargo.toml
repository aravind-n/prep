[package]
name = "mise"
version = "0.2.8"
edition = "2024"

[dependencies]
anyhow = { version = "1.0.100", features = ["std", "backtrace"] }
clap = { version = "4.5.45", features = ["derive", "env"] }
features = "0.10.0"
petgraph = "0.8.2"
serde = { version = "1.0.219", features = ["derive"] }
shellexpand = "3.1.1"
toml = "0.9.5"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["json", "env-filter", "chrono", "ansi"] }

[dev-dependencies]
tempfile = "3.22.0"
