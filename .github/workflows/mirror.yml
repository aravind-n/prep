name: Mirror to GitLab

on:
  push:
    branches: [master]
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gitlab-mirror
  cancel-in-progress: true

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Configure GitLab deploy key
        env:
          GITLAB_MIRROR_SSH_KEY: ${{ secrets.GITLAB_MIRROR_SSH_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$GITLAB_MIRROR_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' 'gitlab.com ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIAfuCHKVTjquxvt6CM6tdG4SLp1Btn/nOeHHE5UOzRdf' > ~/.ssh/known_hosts
      - name: Mirror master and release tags
        run: |
          git clone --bare "https://github.com/${GITHUB_REPOSITORY}.git" repo.git
          git -C repo.git push --prune \
            "git@gitlab.com:aravind/prep.git" \
            "+refs/heads/master:refs/heads/master" \
            "+refs/tags/v*:refs/tags/v*"
