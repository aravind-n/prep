name = "example"
description = "An example recipe"
author = "mise"
depends_on = [] # names of any upstream dependencies

[env]
MSG = "Hello, World!"

[[steps]]
name = "hello-world"
description = "Prints a greeting to the console"
cmd = "echo $MSG"

[[steps]]
name = "macos-only-step"
description = "Prints the device specs on macos"
cmd = "echo $(sw_vers -productName) $(sw_vers -productVersion)"
os = ["macos"]

[[steps]]
name = "linux-only-step"
description = "Prints the device specs on linux"
cmd = "lsb_release -ds"
os = ["linux"]

[[steps]]
name = "windows-only-step"
description = "Prints the device specs on windows"
cmd = "echo 'Windows support not yet implemented'"
os = ["windows"]
